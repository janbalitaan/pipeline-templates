name: Python setup
description: >
  Install uv, install a Python version and sync the project. The step every
  Python job starts with.

inputs:
  python-version:
    description: Interpreter to install.
    required: false
    default: '3.12'
  sync-args:
    description: Extra arguments for `uv sync`, such as --all-extras.
    required: false
    default: ''
  cache:
    description: Whether to cache the uv download and resolution.
    required: false
    default: 'true'

  working-directory:
    description: >
      Where to run. Defaults to the repository root; a monorepo points it at
      one of its packages.
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: ${{ inputs.cache }}

    - name: Install Python ${{ inputs.python-version }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv python install ${{ inputs.python-version }}

    - name: Sync
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync --dev ${{ inputs.sync-args }}
